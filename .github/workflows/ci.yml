name: ci

# Host-side gates for the emulator (apps/vagus), one parallel job each:
# compile (warnings as errors) + format, tests, Credo, Dialyzer, Sobelow, a
# dependency audit, and Argus. Everything runs at MIX_TARGET=host — the
# Nerves system / firmware build is target-only (targets:-gated deps) and
# lives in the nerves_system_vagus repo's own CI, so nothing here pulls
# Buildroot.
#
# Every job repeats the same setup (native build deps, BEAM, hex/rebar/
# nerves_bootstrap, deps cache under its own key prefix, deps.get).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must track .mise.toml. erlef/setup-beam needs the bare OTP version and an
  # Elixir version tagged with the OTP major.
  OTP_VERSION: "29.0.3"
  ELIXIR_VERSION: "1.20.2-otp-29"
  MIX_TARGET: host

jobs:
  build:
    name: Compile + format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nerves_uevent compiles a C port that #includes <libmnl/libmnl.h>, and
      # it's pulled into the host build too — the runner needs the netlink dev
      # headers (build-essential is already on the image).
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmnl-dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        id: mix-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-build-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'vendor/**', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            mix-build-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      - name: Install hex, rebar, nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          # nerves_bootstrap injects a nerves.bootstrap step into deps.* for
          # every project in the umbrella; the apps declare {:nerves,
          # runtime: false} so it's satisfied at MIX_TARGET=host. Matches the
          # local dev/toolchain setup.
          mix archive.install hex nerves_bootstrap --force

      - name: Fetch deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nerves_uevent compiles a C port that #includes <libmnl/libmnl.h>, and
      # it's pulled into the host build too — the runner needs the netlink dev
      # headers (build-essential is already on the image).
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmnl-dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        id: mix-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'vendor/**', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            mix-test-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      - name: Install hex, rebar, nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          # nerves_bootstrap injects a nerves.bootstrap step into deps.* for
          # every project in the umbrella; the apps declare {:nerves,
          # runtime: false} so it's satisfied at MIX_TARGET=host. Matches the
          # local dev/toolchain setup.
          mix archive.install hex nerves_bootstrap --force

      - name: Fetch deps
        run: mix deps.get

      # Full suite — no exclusions. The former `@tag :flaky` quarantine
      # (BootStarterTest's global-Fake assertions, WatchdogTest's wall-clock
      # backoff-ratio test) was resolved by hardening: BootStarter now scopes
      # to `Fake.calls_for/1` (per-add-on, immune to a foreign writer) and the
      # watchdog backoff asserts the computed schedule via an injected `:sleep`
      # instead of measured time.
      - name: Tests
        run: mix test

  credo:
    name: Credo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nerves_uevent compiles a C port that #includes <libmnl/libmnl.h>, and
      # it's pulled into the host build too — the runner needs the netlink dev
      # headers (build-essential is already on the image).
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmnl-dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        id: mix-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-credo-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'vendor/**', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            mix-credo-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      - name: Install hex, rebar, nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          # nerves_bootstrap injects a nerves.bootstrap step into deps.* for
          # every project in the umbrella; the apps declare {:nerves,
          # runtime: false} so it's satisfied at MIX_TARGET=host. Matches the
          # local dev/toolchain setup.
          mix archive.install hex nerves_bootstrap --force

      - name: Fetch deps
        run: mix deps.get

      # Credo / Dialyzer / Sobelow / Argus are declared in apps/vagus (that's
      # where the code + their configs live). Run them from there.
      - name: Credo
        working-directory: apps/vagus
        run: mix credo --strict

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nerves_uevent compiles a C port that #includes <libmnl/libmnl.h>, and
      # it's pulled into the host build too — the runner needs the netlink dev
      # headers (build-essential is already on the image).
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmnl-dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # The Dialyzer PLT lives under _build, so a warm _build cache also skips
      # the (slow) first-run PLT build. vendor/** is in the key because
      # vendored path deps (mqttx, fresh) aren't in mix.lock but must
      # invalidate the PLT like any other dep change. The mix.exs files are in
      # the key too: plt_add_apps lives in apps/vagus/mix.exs, and a
      # PLT-affecting edit there must bust the cache so the drop-guard below
      # fires and rebuilds the PLT against the current app set.
      - name: Cache deps and _build
        id: mix-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-dialyzer-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'vendor/**', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            mix-dialyzer-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      # PLT staleness guard: dialyxir never checks/updates a PLT from an
      # umbrella child (apps/vagus), so a PLT restored via restore-keys
      # prefix fallback stays frozen at its build-time app set — every dep
      # added since then dialyzes as "unknown_function" forever (this is how
      # CI's PLT missed mqttx from M5 until vagus-bluetooth). On an exact
      # key miss (deps changed), drop the PLTs so the Dialyzer step rebuilds
      # them against the CURRENT app set.
      - name: Drop stale Dialyzer PLTs on cache-key miss
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: rm -f _build/*/dialyxir_*.plt _build/*/dialyxir_*.plt.hash

      - name: Install hex, rebar, nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          # nerves_bootstrap injects a nerves.bootstrap step into deps.* for
          # every project in the umbrella; the apps declare {:nerves,
          # runtime: false} so it's satisfied at MIX_TARGET=host. Matches the
          # local dev/toolchain setup.
          mix archive.install hex nerves_bootstrap --force

      - name: Fetch deps
        run: mix deps.get

      - name: Dialyzer
        working-directory: apps/vagus
        run: mix dialyzer

  sobelow:
    name: Sobelow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nerves_uevent compiles a C port that #includes <libmnl/libmnl.h>, and
      # it's pulled into the host build too — the runner needs the netlink dev
      # headers (build-essential is already on the image).
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmnl-dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        id: mix-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-sobelow-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'vendor/**', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            mix-sobelow-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      - name: Install hex, rebar, nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          # nerves_bootstrap injects a nerves.bootstrap step into deps.* for
          # every project in the umbrella; the apps declare {:nerves,
          # runtime: false} so it's satisfied at MIX_TARGET=host. Matches the
          # local dev/toolchain setup.
          mix archive.install hex nerves_bootstrap --force

      - name: Fetch deps
        run: mix deps.get

      - name: Sobelow
        working-directory: apps/vagus
        run: mix sobelow

  audit:
    name: Hex audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nerves_uevent compiles a C port that #includes <libmnl/libmnl.h>, and
      # it's pulled into the host build too — the runner needs the netlink dev
      # headers (build-essential is already on the image).
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmnl-dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        id: mix-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-audit-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'vendor/**', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            mix-audit-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      - name: Install hex, rebar, nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          # nerves_bootstrap injects a nerves.bootstrap step into deps.* for
          # every project in the umbrella; the apps declare {:nerves,
          # runtime: false} so it's satisfied at MIX_TARGET=host. Matches the
          # local dev/toolchain setup.
          mix archive.install hex nerves_bootstrap --force

      - name: Fetch deps
        run: mix deps.get

      # Retired packages and EEF/GHSA security advisories.
      - name: Hex audit
        run: mix hex.audit

      # `deps.unlock --check-unused` loads every target's deps, including the
      # Nerves systems' path deps at ../../../nerves_system_vagus (relative to
      # apps/vagus_platform — a SIBLING of this checkout). Without them the
      # system-build deps they pull in (nerves_system_br, the toolchain) read
      # as unused. actions/checkout only writes inside the workspace, so check
      # it out there and move it next to the repo. Same ref as release.yml's
      # SYSTEM_RELEASE_TAG; nothing is fetched or built from it here.
      - uses: actions/checkout@v4
        with:
          repository: bbangert/nerves_system_vagus
          ref: v0.3.4
          path: nerves_system_vagus

      - name: Check for unused locked deps
        run: |
          mv nerves_system_vagus ../nerves_system_vagus
          mix deps.unlock --check-unused

  argus:
    name: Argus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nerves_uevent compiles a C port that #includes <libmnl/libmnl.h>, and
      # it's pulled into the host build too — the runner needs the netlink dev
      # headers (build-essential is already on the image).
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmnl-dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        id: mix-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-argus-u2404-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'vendor/**', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            mix-argus-u2404-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      - name: Install Souffle
        run: |
          # Souffle's PPA package links against libffi7, which Ubuntu 24.04
          # dropped; install the Ubuntu 20.04 build (checksum-pinned) first.
          curl -fsSLo /tmp/libffi7.deb http://archive.ubuntu.com/ubuntu/pool/main/libf/libffi/libffi7_3.3-4_amd64.deb
          echo "4584aa8fef1bf5086168ce2f7078cd2ebd78fdc4cc0d86d958d795d4e0b0f50d  /tmp/libffi7.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/libffi7.deb
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle

      - name: Install hex, rebar, nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          # nerves_bootstrap injects a nerves.bootstrap step into deps.* for
          # every project in the umbrella; the apps declare {:nerves,
          # runtime: false} so it's satisfied at MIX_TARGET=host. Matches the
          # local dev/toolchain setup.
          mix archive.install hex nerves_bootstrap --force

      - name: Fetch deps
        run: mix deps.get

      # Whole-program OTP/supervision analysis over the compiled beams. No
      # file-level ignores: every finding must be fixed or carry a reviewed
      # entry in apps/vagus/.argus-baseline.exs (see
      # scripts/argus_baseline.exs). Compile first so build output never
      # mixes into the JSON report.
      - name: Compile
        working-directory: apps/vagus
        run: mix compile

      - name: Argus
        working-directory: apps/vagus
        run: mix argus --format json > argus.json

      - name: Self-test the baseline checker
        run: elixir scripts/argus_baseline.exs --self-test

      - name: Check findings against the reviewed baseline
        working-directory: apps/vagus
        run: elixir ../../scripts/argus_baseline.exs argus.json .argus-baseline.exs
