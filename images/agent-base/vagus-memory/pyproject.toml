# Tooling config only: the image copies vagus_memory/ into the venv's site-packages
# rather than building a wheel, so no unpinned build backend is fetched at image build.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
