[tools]
erlang = "29.0.3"
elixir = "1.20.2-otp-29"

[env]
MIX_TARGET = "rpi3"

[tasks.test]
description = "Run tests with MIX_TARGET=host"
run = "MIX_TARGET=host mix test"

[tasks.firmware]
description = "Build firmware for a target: mise run firmware -- rpi3"
run = 'MIX_TARGET="{{arg(name="target")}}" mix firmware'

[tasks.mix-for]
description = "Run a mix task for a target: mise run mix-for -- rpi0 deps.get"
run = 'MIX_TARGET="{{arg(name="target")}}" mix "{{arg(name="task")}}"'
